    DIVISÃO DOS ARTIGOS POR SUBSEÇÃO:

    2.5.1 Estudos sobre machine learning aplicado à otimização de portfólios
    

    Nesta subseção, usar os artigos que tratam de previsão, pré-seleção de ativos, machine learning e formação/otimização de portfólios, mesmo quando não são especificamente sobre criptoativos.

    Artigos principais:

    - Chen et al. (2021) — Mean–variance portfolio optimization using machine learning-based stock price prediction.
    - Ma, Han e Wang (2021) — Portfolio optimization with return prediction using deep learning and machine learning.
    - Wang et al. (2020) — Portfolio formation with preselection using deep learning from long-term financial data.
    - Padhi et al. (2022) — An Intelligent Fusion Model with Portfolio Selection and Machine Learning for Stock Market Prediction.
    - Paiva et al. (2019) — Decision-making for financial trading: a fusion approach of machine learning and portfolio selection.

    Função da subseção:
    Mostrar que a literatura tem usado machine learning para prever retornos/preços, selecionar ativos promissores e melhorar a construção de portfólios em comparação com abordagens tradicionais.


    2.5.2 Estudos sobre média-variância e Markowitz em criptoativos

    Nesta subseção, usar os artigos que aplicam diretamente o modelo média-variância, a teoria de Markowitz ou a diversificação de portfólios em criptomoedas/criptoativos.

    Artigos principais:

    - Brauneis e Mestel — Cryptocurrency-portfolios in a mean-variance framework.
    - Jeleskovic et al. — Optimization of portfolios with cryptocurrencies: Markowitz and GARCH-Copula model approach.
    - Zouaoui e Naas (2025) — Portfolio Optimization Based on MPT-LSTM Neural Networks: A case study of Cryptocurrency Markets.

    Função da subseção:
    Conectar diretamente a teoria de Markowitz ao mercado de criptoativos, destacando volatilidade, diversificação, risco-retorno, índice de Sharpe e limitações práticas das carteiras de criptomoedas.


    2.5.3 Estudos híbridos entre Markowitz, machine learning, deep learning e reinforcement learning

    Nesta subseção, usar os artigos que combinam explicitamente Markowitz, média-variância, machine learning, deep learning, previsão de retornos ou reinforcement learning.

    Artigos principais:

    - Chaweewanchon e Chaysiri (2022) — Markowitz Mean-Variance Portfolio Optimization with Predictive Stock Selection Using Machine Learning.
    - Du (2022) — Mean–variance portfolio optimization with deep learning based-forecasts for cointegrated stocks.
    - Ślusarczyk e Ślepaczuk (2025) — Optimal Markowitz portfolio using returns forecasted with time series and machine learning models.
    - Jiang, Olmo e Atwi (2024) — Deep reinforcement learning for portfolio selection.
    - Jang e Seong (2023) — Deep reinforcement learning for stock portfolio optimization by connecting with modern portfolio theory.
    - López de Prado et al. (2025) — Enhancing Markowitz’s portfolio selection paradigm with machine learning.

    Função da subseção:
    Mostrar que a abordagem híbrida entre teoria moderna de portfólio e inteligência artificial já aparece na literatura, mas com diferentes técnicas, bases de dados, mercados e níveis de complexidade. Essa subseção deve aproximar diretamente os estudos relacionados da proposta do anteprojeto.


    2.5.4 Síntese crítica dos estudos relacionados

    Nesta subseção, usar os estudos anteriores de forma comparativa e também os artigos de revisão para consolidar a discussão.

    Artigos de apoio:

    - Sutiene et al. (2024) — Enhancing portfolio management using artificial intelligence: literature review.
    - Giantsidi e Tarantola (2025) — Deep learning for financial forecasting: A review of recent trends.
    - López de Prado et al. (2025) — Enhancing Markowitz’s portfolio selection paradigm with machine learning.

    Função da subseção:
    Comparar os estudos apresentados, destacando convergências, divergências, limitações e lacunas. A síntese deve mostrar que:
    - há uma tendência de integrar previsão por machine learning à otimização de portfólios;
    - os resultados frequentemente indicam melhora em retorno, risco ou índice de Sharpe;
    - os ganhos não são universais;
    - existem limitações relacionadas a custos de transação, rotatividade da carteira, sensibilidade a hiperparâmetros, instabilidade dos mercados, overfitting e interpretabilidade;
    - ainda há espaço para investigar modelos híbridos aplicados especificamente a criptoativos.


